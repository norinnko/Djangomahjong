{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>麻雀点数計算アプリ ~じゃんしへの道~</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap');
        body {
            font-family: 'Noto Sans JP', sans-serif;
        }
        .mahjong-tile {
            width: 40px;
            height: auto;
            display: inline-block;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .mahjong-tile:hover {
            transform: translateY(-2px);
        }
        .mahjong-tile-selected {
            border: 2px solid #3b82f6;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">
    <nav class="bg-slate-800 text-white p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <a href="{% url 'calculator:index' %}" class="text-xl font-bold flex items-center gap-2">
                🀄 じゃんしへの道
            </a>
            <div class="space-x-4">
                {% if user.is_authenticated %}
                    <span>ようこそ, {{ user.username }}さん</span>
                    <a href="{% url 'calculator:index' %}" class="hover:text-blue-300 transition">計算機</a>
                    <a href="{% url 'calculator:history_list' %}" class="hover:text-blue-300 transition">履歴</a>
                    <a href="{% url 'accounts:logout' %}" class="hover:text-red-300 transition">ログアウト</a>
                {% else %}
                    <a href="{% url 'accounts:login' %}" class="hover:text-blue-300 transition">ログイン</a>
                    <a href="{% url 'accounts:register' %}" class="hover:text-blue-300 transition">新規登録</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="container mx-auto p-4 md:p-8">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-slate-800 text-slate-400 text-center p-4 mt-8">
        &copy; 2026 Mahjong Calc App
    </footer>
</body>
</html>
