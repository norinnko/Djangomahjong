{% extends "base.html" %}
{% block title %}ログイン | 麻雀 点数計算{% endblock %}
{% block content %}
<h1>ログイン</h1>
<div class="card narrow">
  <form method="post">
    {% csrf_token %}
    <div class="field"><label>ユーザー名</label>{{ form.username }}</div>
    <div class="field"><label>パスワード</label>{{ form.password }}</div>
    <button class="btn" type="submit">ログイン</button>
  </form>
</div>
{% endblock %}
