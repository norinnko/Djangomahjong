{% extends "base.html" %}
{% block title %}削除 #{{ obj.id }} | 麻雀 点数計算{% endblock %}
{% block content %}
<h1>削除確認</h1>
<div class="card">
  <p>履歴 #{{ obj.id }} を削除しますか？</p>
  <form method="post">
    {% csrf_token %}
    <button class="btn-danger" type="submit">削除する</button>
    <a class="btn-secondary" href="{% url 'calcapp:history_detail' obj.id %}">戻る</a>
  </form>
</div>
{% endblock %}
